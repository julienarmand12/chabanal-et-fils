<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic empreinte V2 — lecture seule</title><style>body{font:16px system-ui;background:#101b26;color:#eaf2f8;max-width:680px;margin:35px auto;padding:18px}button{padding:14px;border:0;border-radius:10px;background:#75c8aa;color:#10251f;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#223444;padding:16px;border-radius:10px}</style><h2>Diagnostic de réception V2 — lecture seule</h2><p>Cette page ne modifie aucune fiche ni aucune donnée locale. Elle ne transmet aucune information.</p><button id="go">Lancer le diagnostic</button><pre id="out">En attente</pre><script>const KEY="metier_clients_v1_2_corrigee",BASE="chabanal_v2_clients_verified_baseline_sha256";async function digest(s){let b=new TextEncoder().encode(s);return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",b)),x=>x.toString(16).padStart(2,"0")).join("")}document.querySelector("#go").onclick=async()=>{const raw=localStorage.getItem(KEY);let meta={},base=null,q={};try{meta=JSON.parse(localStorage.getItem("chabanal_v2_cloud_meta")||"{}")}catch{}try{base=JSON.parse(localStorage.getItem(BASE)||"null")}catch{}try{q=JSON.parse(localStorage.getItem("chabanal_v2_sync_queue")||"{}")}catch{}let count=null;try{let v=JSON.parse(raw);count=Array.isArray(v)?v.length:null}catch{}let hash=raw===null?null:await digest(raw);let r={date:new Date().toISOString(),clientsLocaux:count,versionLocaleConnue:meta[KEY]??null,empreintePresente:!!base,versionEmpreinte:base?.version??null,empreinteCorrespond:!!base&&base.sha256===hash,fileClientsEnAttente:!!q[KEY],stockageClientsPresent:raw!==null};document.querySelector("#out").textContent=JSON.stringify(r,null,2);};</script></html>
