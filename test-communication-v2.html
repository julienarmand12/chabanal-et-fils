<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Test indépendant V2</title><style>body{font:16px system-ui;background:#071b32;color:#eaf3ff;max-width:760px;margin:auto;padding:18px}button{padding:14px;margin:6px 4px;background:#176bc0;color:white;border:0;border-radius:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#102c49;padding:16px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><h2>Test indépendant de communication V2</h2><p>Fermez l'application principale sur les deux téléphones. Ce test utilise une clé technique distincte : il ne modifie aucune fiche client, intervention ou suppression. L'écriture est déclenchée uniquement par le bouton dédié.</p><button id="check">1. Vérifier la connexion (lecture seule)</button><button id="write">2. Écrire un témoin technique (téléphone 1)</button><button id="read">3. Lire le témoin (téléphone 2)</button><pre id="out">En attente.</pre><script>
const C='metier_clients_v1_2_corrigee',D='metier_clients_deleted_v1',Q='chabanal_v2_sync_queue',M='chabanal_v2_cloud_meta',K='chabanal_v2_cloud_config',T='chabanal_v2_test_communication_20261127',out=document.getElementById('out');
const parse=k=>JSON.parse(localStorage.getItem(k)||'null');
async function setup(){const c=parse(C),m=parse(M),q=parse(Q),cfg=parse(K);if(!Array.isArray(c)||c.length!==758||Number(m?.[C])!==557||!q||Object.keys(q).length)throw Error('État local inattendu, test interrompu');if(cfg?.url!=='https://kqdsrezgwlkiezxyqkiv.supabase.co'||!cfg.key)throw Error('Configuration absente');const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:false,detectSessionInUrl:false,storage:localStorage}});const s=await sb.auth.getSession();if(s.error||!s.data.session)throw Error('Session Supabase absente');return {sb,uid:s.data.session.user.id}}
async function run(fn){document.querySelectorAll('button').forEach(x=>x.disabled=true);try{out.textContent=await fn()}catch(e){out.textContent='ARRÊT : '+e.message+'\nAucune modification des fiches clients.'}finally{document.querySelectorAll('button').forEach(x=>x.disabled=false)}}
document.getElementById('check').onclick=()=>run(async()=>{const {sb}=await setup(),r=await sb.from('app_sync_state').select('version').eq('key_name',C).single();if(r.error||Number(r.data.version)!==557)throw Error('Lecture cloud clients impossible ou version changée');return 'CONNEXION VALIDÉE — LECTURE SEULE\nVersion clients cloud : 557\nAucune écriture effectuée.'});
document.getElementById('write').onclick=()=>run(async()=>{const {sb,uid}=await setup();const before=await sb.from('app_sync_state').select('key_name,version,value_json').eq('key_name',T).maybeSingle();if(before.error)throw Error('Contrôle du témoin impossible : '+before.error.message);if(before.data)throw Error('Témoin déjà présent : aucune réécriture automatique. Utilisez Lire le témoin.');if(!confirm('Créer une seule ligne de test technique dans Supabase, sans toucher aux fiches clients ?'))return 'ANNULÉ — aucune écriture.';const value={purpose:'test-communication-v2',created_by:uid,marker:'test-v2-20261127',created_at:new Date().toISOString()};const r=await sb.from('app_sync_state').insert({key_name:T,value_json:value,version:1,updated_by:uid,change_reason:'test communication indépendant v2'}).select('key_name,version,value_json').single();if(r.error)throw Error('Écriture refusée : '+r.error.message);if(r.data.key_name!==T||r.data.value_json?.marker!==value.marker)throw Error('Réponse écriture inattendue');return 'TÉMOIN ÉCRIT — TÉLÉPHONE 1\nClé technique : '+T+'\nMarqueur : '+value.marker+'\nHorodatage : '+value.created_at+'\nAucune fiche client modifiée. Fermez cette page et ouvrez-la sur le téléphone 2 pour lire le témoin.'});
document.getElementById('read').onclick=()=>run(async()=>{const {sb}=await setup(),r=await sb.from('app_sync_state').select('version,value_json').eq('key_name',T).maybeSingle();if(r.error)throw Error('Lecture du témoin impossible : '+r.error.message);if(!r.data)return 'AUCUN TÉMOIN TROUVÉ — aucun changement effectué.';if(r.data.value_json?.marker!=='test-v2-20261127')throw Error('Témoin inattendu');return 'TÉMOIN LU — TÉLÉPHONE 2\nVersion : '+r.data.version+'\nMarqueur : '+r.data.value_json.marker+'\nHorodatage : '+r.data.value_json.created_at+'\nAucune écriture effectuée.'});
</script></html>
