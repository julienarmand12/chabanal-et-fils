<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vérification famille 370 clés</title><style>body{font:16px system-ui;background:#0c1d2b;color:#edf5ff;max-width:760px;margin:auto;padding:18px}button{padding:13px;border:0;border-radius:9px;background:#277db4;color:white;font-weight:bold}pre{background:#173047;padding:15px;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}</style><h2>Vérification des 370 entrées</h2><p>Lecture seule : aucune donnée n'est modifiée. Le rapport ne contient ni nom de clé, ni contenu client, ni valeur brute.</p><button id="go">Vérifier les répétitions</button><pre id="out">En attente.</pre><script>
const known=/client|intervention|backup|sauvegarde|archive|ancien|old|diagnostic|audit|test|temoin|verification|comparaison|reparation|chaudi|pac|adouc|equip|stock|sync|cloud|queue|baseline|empreinte|photo|image|document|pdf/i;
const stem=k=>k.replace(/[0-9a-f]{8}-[0-9a-f-]{20,}/gi,'#').replace(/\d{4,}/g,'#').replace(/[0-9a-f]{24,}/gi,'#').replace(/\d+$/,'#');
const kib=x=>Math.round(x/1024);
async function digest(v){let b=new TextEncoder().encode(v);let h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('go').onclick=async()=>{let out=document.getElementById('out');out.textContent='Calcul en cours…';try{let groups=new Map();for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(known.test(k))continue;let v=localStorage.getItem(k)||'',s=stem(k),g=groups.get(s)||[];g.push({k,v});groups.set(s,g)}let entries=[...groups.values()].sort((a,b)=>b.length-a.length)[0]||[];let hashes=new Map(),shapes=new Map(),lengths=new Map(),fieldCounts=new Map(),dateFields=0;for(let {v} of entries){let h=await digest(v);hashes.set(h,(hashes.get(h)||0)+1);let len=v.length;lengths.set(len,(lengths.get(len)||0)+1);try{let x=JSON.parse(v);let shape=Array.isArray(x)?'tableau':x===null?'null':typeof x;shapes.set(shape,(shapes.get(shape)||0)+1);if(x&&typeof x==='object'&&!Array.isArray(x)){let n=Object.keys(x).length;fieldCounts.set(n,(fieldCounts.get(n)||0)+1);if(Object.keys(x).some(k=>/date|time|updated|created|timestamp/i.test(k)))dateFields++}}catch(e){shapes.set('JSON invalide',(shapes.get('JSON invalide')||0)+1)}}let duplicateGroups=[...hashes.values()].filter(n=>n>1);let result={mode:'lecture seule',date:new Date().toISOString(),nombreEntreesFamille:entries.length,tailleTotaleKio:kib(entries.reduce((a,x)=>a+2*(x.k.length+x.v.length),0)),contenusDistincts:hashes.size,contenusStrictementIdentiquesEnDouble:entries.length-hashes.size,nombreDeGroupesIdentiques:duplicateGroups.length,plusGrandGroupeIdentique:Math.max(0,...hashes.values()),taillesDistinctes: lengths.size,typesObjets:Object.fromEntries(shapes),repartitionNombreChamps:Object.fromEntries([...fieldCounts].sort((a,b)=>b[1]-a[1]).slice(0,10)),objetsAvecChampDeDate:dateFields,note:'Les empreintes sont comparées localement et ne sont pas affichées. Aucun nom de clé ni donnée personnelle n’est transmis. La présence de doublons ne prouve pas que ces clés peuvent être supprimées.'};out.textContent=JSON.stringify(result,null,2)}catch(e){out.textContent='Erreur : '+e.message}}</script></html>
