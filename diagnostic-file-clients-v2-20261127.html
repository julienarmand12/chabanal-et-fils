<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic file clients V2</title><style>body{font:16px system-ui;background:#111e29;color:#ecf4fa;max-width:680px;margin:30px auto;padding:18px}button{padding:13px 18px;border:0;border-radius:9px;background:#80cdb4;color:#10251c;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#263b4c;padding:15px;border-radius:10px}</style><h2>File d'attente V2 — lecture seule</h2><p>Contrôle local uniquement : aucune écriture, aucun contact avec Supabase. Aucun nom, numéro de téléphone, adresse ou identifiant client n'est affiché.</p><button id="go">Analyser la file d'attente</button><pre id="out">En attente.</pre><script>document.getElementById("go").onclick=()=>{try{const k="metier_clients_v1_2_corrigee";let q=JSON.parse(localStorage.getItem("chabanal_v2_sync_queue")||"{}");let m=JSON.parse(localStorage.getItem("chabanal_v2_cloud_meta")||"{}");let e=q[k]||null,p=e?.patch||null,changes=p&&typeof p.changes==="object"?Object.values(p.changes):[];let a={date:new Date().toISOString(),versionLocaleConnue:m[k]??null,clesEnAttente:Object.keys(q).length,clientEnAttente:!!e,raison:e?.reason??null,dateMiseEnAttente:e?.queuedAt??null,patchPresent:!!p,typePatch:p?.kind??null,nombreEntreesPatch:changes.length,ajouts:0,suppressions:0,modifications:0,patchSansDetail:!!e&&!p};if(p?.kind==="clients"){for(let x of changes){if(x&&Object.hasOwn(x,"before")&&Object.hasOwn(x,"after")){if(x.before==null&&x.after!=null)a.ajouts++;else if(x.before!=null&&x.after==null)a.suppressions++;else a.modifications++}else a.modifications++}}document.getElementById("out").textContent=JSON.stringify(a,null,2)}catch(e){document.getElementById("out").textContent="Erreur de lecture : "+e.message}};</script></html>
