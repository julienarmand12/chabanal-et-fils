<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Suppression locale Patrimoine</title><style>body{font:16px system-ui;background:#0b1c2b;color:#f0f5ff;max-width:700px;margin:auto;padding:20px}button{border:0;border-radius:9px;padding:13px;font-weight:bold;background:#a53838;color:#fff}button:disabled{opacity:.4}pre{background:#173044;padding:14px;white-space:pre-wrap;border-radius:9px}label{display:block;margin:18px 0}</style><h2>Suppression des données locales Patrimoine</h2><p>Cette opération supprime uniquement les clés <code>localStorage</code> commençant par <code>patrimoine-familial-</code> dans ce navigateur. Elle ne touche pas aux données de Chabanal et fils, ni aux données Supabase, ni aux autres stockages du navigateur.</p><button id="scan">1. Vérifier les clés ciblées</button><pre id="report">En attente</pre><label><input type="checkbox" id="ok"> Je confirme vouloir supprimer définitivement les données locales Patrimoine de ce navigateur.</label><button id="del" disabled>2. Supprimer les clés Patrimoine</button><script>let expected=null;const report=document.getElementById('report'),confirm=document.getElementById('ok'),del=document.getElementById('del');const keys=()=>Object.keys(localStorage).filter(k=>k.startsWith('patrimoine-familial-')).sort();document.getElementById('scan').onclick=()=>{expected=keys();let bytes=expected.reduce((n,k)=>n+2*(k.length+(localStorage.getItem(k)||'').length),0);report.textContent=JSON.stringify({clesPatrimoine:expected.length,volumeEstimeMio:Math.round(bytes/1048576*100)/100,clesChabanalNonCiblees:true,action:'Aucune suppression effectuée'},null,2);del.disabled=!confirm.checked||expected.length===0};confirm.onchange=()=>{del.disabled=!confirm.checked||!expected?.length};del.onclick=()=>{if(!confirm.checked||!expected?.length)return;if(!window.confirm('Supprimer définitivement '+expected.length+' clés locales Patrimoine de ce navigateur ?'))return;let current=keys();if(current.length!==expected.length||current.some((k,i)=>k!==expected[i])){report.textContent='La liste des clés a changé. Recommencez la vérification avant suppression.';expected=null;del.disabled=true;return}let removed=0;for(let k of expected){localStorage.removeItem(k);removed++}report.textContent=JSON.stringify({clesSupprimees:removed,clesPatrimoineRestantes:keys().length,aucuneCleChabanalCiblee:true,note:'Les données Supabase, Cache Storage et IndexedDB ne sont pas modifiées.'},null,2);expected=null;del.disabled=true;confirm.checked=false}</script></html>
