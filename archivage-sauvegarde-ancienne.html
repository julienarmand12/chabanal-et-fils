<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archivage Chabanal</title><style>body{font:16px system-ui;background:#071b32;color:white;padding:20px}button,input{margin:10px 0;padding:12px;max-width:95%}pre{white-space:pre-wrap}</style><h1>Archivage du 11 octobre — téléphone 1</h1><p>Aucune suppression. Exportez puis sélectionnez le fichier téléchargé pour vérifier son intégrité.</p><button id="export">Exporter la sauvegarde ancienne</button><p>Vérifier le fichier téléchargé :</p><input id="file" type="file" accept=".json"><pre id="out"></pre><script>
const K='chabanal_v2_local_backup_20261011_metier_clients_v1_2_corrigee',C='metier_clients_v1_2_corrigee',M='chabanal_v2_cloud_meta',Q='chabanal_v2_sync_queue',out=document.getElementById('out');
async function hash(s){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))),b=>b.toString(16).padStart(2,'0')).join('')}
function check(){const c=JSON.parse(localStorage.getItem(C)),m=JSON.parse(localStorage.getItem(M)),q=JSON.parse(localStorage.getItem(Q)),raw=localStorage.getItem(K);if(!raw||c.length!==752||Number(m[C])!==496||Object.keys(q).length)throw Error('Téléphone ou état inattendu');const a=JSON.parse(raw);return {raw,shape:Array.isArray(a)?'tableau de '+a.length+' éléments':typeof a}}
document.getElementById('export').onclick=async()=>{try{const {raw,shape}=check(),sha256=await hash(raw),data={format:'chabanal-archive-v1',key:K,createdAt:new Date().toISOString(),sha256,raw};const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='archive-chabanal-2026-10-11.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);out.textContent='EXPORT DEMANDÉ\nStructure : '+shape+'\nTaille estimée : '+2*(K.length+raw.length)+' octets\nSHA-256 : '+sha256+'\nSélectionnez le fichier téléchargé pour vérifier.\nAucune suppression.'}catch(e){out.textContent='ARRÊT : '+e.message}};
document.getElementById('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const a=JSON.parse(await f.text()),{raw,shape}=check(),h=await hash(raw);if(a.format!=='chabanal-archive-v1'||a.key!==K||a.raw!==raw||a.sha256!==h)throw Error('Archive différente du stockage local');out.textContent='ARCHIVE VÉRIFIÉE\nStructure : '+shape+'\nTaille estimée libérable : '+2*(K.length+raw.length)+' octets\nSHA-256 : '+h+'\nFichier strictement identique à la sauvegarde locale.\nAucune suppression effectuée.'}catch(e){out.textContent='ARRÊT : '+e.message}};
</script></html>
