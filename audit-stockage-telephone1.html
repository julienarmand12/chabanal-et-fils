<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Remise à niveau téléphone 1</title><style>body{font:16px system-ui;background:#071b32;color:white;padding:20px;max-width:800px;margin:auto}button{padding:14px;background:#176bc0;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;background:#102c49;padding:15px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><h1>Téléphone 1 — audit stockage et champs</h1><p>Lecture seule. Fermez l'application principale. Aucun changement de données.</p><button id="run">Lancer l’audit complet</button><pre id="out">En attente.</pre><script>
const C='metier_clients_v1_2_corrigee',D='metier_clients_deleted_v1',Q='chabanal_v2_sync_queue',M='chabanal_v2_cloud_meta',K='chabanal_v2_cloud_config';
const read=k=>JSON.parse(localStorage.getItem(k)||'null'),stable=x=>Array.isArray(x)?x.map(stable):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,stable(x[k])])):x,sig=x=>JSON.stringify(stable(x)),eq=(a,b)=>sig(a)===sig(b),bag=a=>a.map(sig).sort(),assert=(v,m)=>{if(!v)throw Error(m)},count=a=>a.reduce((n,x)=>n+(x.interventions||[]).length,0);
function group(a){const m=new Map();for(const x of a){if(!m.has(x.id))m.set(x.id,[]);m.get(x.id).push(x)}return m}
function missing(a,b){const z=bag(b);let n=0;for(const s of bag(a)){const i=z.indexOf(s);if(i<0)n++;else z.splice(i,1)}return n}
document.getElementById('run').onclick=async()=>{const out=document.getElementById('out'),btn=document.getElementById('run');btn.disabled=true;try{
const raw=Object.fromEntries([C,D,Q,M].map(k=>[k,localStorage.getItem(k)])),l=read(C),d=read(D),q=read(Q),m=read(M),cfg=read(K);
assert(Array.isArray(l)&&Array.isArray(d)&&q&&m,'Stockage inattendu');assert(l.length===752&&count(l)===3770&&Number(m[C])===496&&Object.keys(q).length===0,'Ce téléphone ne correspond pas à la sauvegarde attendue');
assert(cfg?.url==='https://kqdsrezgwlkiezxyqkiv.supabase.co'&&cfg.key,'Configuration inattendue');
const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:false,detectSessionInUrl:false,storage:localStorage}});
const ss=await sb.auth.getSession();assert(!ss.error&&ss.data.session,'Session absente');
const [a,b]=await Promise.all([sb.from('app_sync_state').select('value_json,version').eq('key_name',C).single(),sb.from('app_sync_state').select('value_json,version').eq('key_name',D).single()]);
assert(!a.error&&!b.error,'Lecture cloud impossible');assert(Number(a.data.version)===557&&Number(b.data.version)===27,'Versions cloud modifiées');const cd=b.data.value_json;assert(Array.isArray(cd)&&eq(bag(d),bag(cd)),'Suppressions différentes');
const cloud=a.data.value_json.filter(x=>!cd.includes(x.id));assert(cloud.length===758&&count(cloud)===3798,'Totaux cloud inattendus');
const L=group(l),R=group(cloud),fields={},details=[];let localOnly=0,cloudOnly=0,absent=0,duplicates=0,added=0;
for(const [id,ls] of L){const rs=R.get(id);if(!rs){localOnly+=ls.length;continue}if(ls.length!==1||rs.length!==1){if(!eq(bag(ls),bag(rs)))duplicates++;continue}const x=ls[0],y=rs[0];absent+=missing(x.interventions||[],y.interventions||[]);added+=missing(y.interventions||[],x.interventions||[]);const fs=[...new Set([...Object.keys(x),...Object.keys(y)])].filter(k=>k!=='interventions'&&!eq(x[k],y[k]));for(const f of fs)fields[f]=(fields[f]||0)+1;if(fs.length)details.push(id+' : '+fs.map(f=>{const describe=v=>v===undefined?'absent':v===null?'null':v===''?'vide':(['email','phone','addressComplement'].includes(f)?'renseigné ('+String(v).length+' caractères)':JSON.stringify(v));return f+' [local='+describe(x[f])+' ; cloud='+describe(y[f])+']'}).join(', '))}
for(const [id,rs] of R)if(!L.has(id))cloudOnly+=rs.length;
const inventory=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),v=localStorage.getItem(k)||'';inventory.push({k,n:2*(k.length+v.length),type:[C,D,Q,M,K].includes(k)||k.startsWith('metier_')?'métier/synchronisation — conserver':/auth|session|token/i.test(k)?'authentification — conserver':'usage à vérifier dans le code — ne pas supprimer'})}inventory.sort((a,b)=>b.n-a.n);const old=raw[C].length,next=JSON.stringify(cloud).length;let used=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);used+=2*(k.length+(localStorage.getItem(k)||'').length)}
assert(Object.keys(raw).every(k=>localStorage.getItem(k)===raw[k]),'Stockage modifié pendant le contrôle');
out.textContent=['SIMULATION — LECTURE SEULE','Local : 752 / 3770 / v496','Cloud : 758 / 3798 / v557','Fiches uniquement locales : '+localOnly,'Fiches uniquement cloud : '+cloudOnly,'Interventions locales absentes du cloud : '+absent,'Interventions supplémentaires sur fiches communes : '+added,'Groupes de doublons divergents : '+duplicates,'Suppressions identiques','Champs différents : '+JSON.stringify(fields),...details,'Taille clients actuelle (octets UTF-16 estimés) : '+old*2,'Taille cible (octets UTF-16 estimés) : '+next*2,'Stockage total estimé : '+used,'Stockage projeté estimé : '+(used+2*(next-old)),'INVENTAIRE LOCALSTORAGE (octets UTF-16 estimés)',...inventory.map(x=>x.k+' : '+x.n+' — '+x.type),'Quota réel non testé : aucune écriture de test','Aucune correction effectuée.'].join('\n');
}catch(e){out.textContent='ARRÊT : '+e.message+'\nAucune correction effectuée.'}finally{btn.disabled=false}};
</script></html>
