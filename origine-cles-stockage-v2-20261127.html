<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Origine des 370 clés — lecture seule</title><style>body{font:16px system-ui;background:#0b1b2a;color:#f0f6ff;max-width:760px;margin:20px auto;padding:18px}button{background:#277eb2;color:#fff;border:0;border-radius:8px;padding:14px;font-weight:bold}pre{background:#183047;padding:15px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}</style><h2>Identifier l'origine des 370 clés</h2><p>Analyse en lecture seule. Les valeurs stockées ne sont jamais affichées. Les noms de clés sont masqués, sauf un préfixe technique strictement filtré.</p><button id="go">Identifier la famille</button><pre id="out">En attente.</pre><script>
const known=/client|intervention|backup|sauvegarde|archive|ancien|old|diagnostic|audit|test|temoin|verification|comparaison|reparation|chaudi|pac|adouc|equip|stock|sync|cloud|queue|baseline|empreinte|photo|image|document|pdf/i;
const stem=k=>k.replace(/[0-9a-f]{8}-[0-9a-f-]{20,}/gi,'#').replace(/\d{4,}/g,'#').replace(/[0-9a-f]{24,}/gi,'#').replace(/\d+$/,'#');
document.getElementById('go').onclick=()=>{try{let groups=new Map();for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(known.test(k))continue;let s=stem(k),a=groups.get(s)||[];a.push(k);groups.set(s,a)}let keys=[...groups.values()].sort((a,b)=>b.length-a.length)[0]||[];let common=keys.length?keys.reduce((p,k)=>{let i=0;while(i<p.length&&i<k.length&&p[i]===k[i])i++;return p.slice(0,i)},keys[0]):'';let safe=/^[a-zA-Z][a-zA-Z0-9_.:-]{2,50}$/.test(common)&&!/@/.test(common)&&!/(?:mail|phone|nom|prenom|address|token|secret|auth|session)/i.test(common);let sample=keys.slice(0,3).map(k=>({longueurCle:k.length,terminaisonNumerique:/\d+$/.test(k),contientUUID:/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}/i.test(k)}));document.getElementById('out').textContent=JSON.stringify({mode:'lecture seule',famillePrincipale:keys.length,taillePrefixeCommun:common.length,prefixeTechniqueFiltre:safe?common:'masqué par précaution',longueursDesCles:[...new Set(keys.map(k=>k.length))].sort((a,b)=>a-b).slice(0,15),formatsExemples:sample,note:'Si le préfixe est masqué, aucune identification fiable n’est possible sans inspection supplémentaire. Aucune clé n’a été modifiée.'},null,2)}catch(e){document.getElementById('out').textContent='Erreur : '+e.message}}</script></html>
