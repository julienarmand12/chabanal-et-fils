<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finaliser suppression locale Patrimoine</title><style>body{font:16px system-ui;background:#0c1b2b;color:#fff;max-width:650px;margin:30px auto;padding:18px}button{padding:14px;background:#b53d3d;color:white;border:0;border-radius:8px}pre{padding:15px;background:#1a3245;white-space:pre-wrap}</style><h2>Supprimer la configuration Patrimoine restante</h2><p>La configuration Supabase de Patrimoine est enregistrée sous une clé différente de celles déjà supprimées. Cette page supprime uniquement cette configuration locale, jamais les clés Chabanal.</p><button id="b">Vérifier et supprimer avec confirmation</button><pre id="out">En attente</pre><script>document.getElementById('b').onclick=()=>{let k='patrimoine-supabase-config-v2';if(localStorage.getItem(k)===null){document.getElementById('out').textContent='Configuration Patrimoine absente. Aucune suppression nécessaire.';return}if(!confirm('Supprimer la configuration locale Supabase de Patrimoine sur ce navigateur ?'))return;localStorage.removeItem(k);document.getElementById('out').textContent=localStorage.getItem(k)===null?'Configuration Patrimoine supprimée. Aucune clé Chabanal modifiée.':'Erreur : configuration toujours présente.'}</script></html>
