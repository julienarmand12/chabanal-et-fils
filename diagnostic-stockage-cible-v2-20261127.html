<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Diagnostic ciblé stockage — Chabanal</title><style>body{font:16px system-ui;background:#0c1b2a;color:#f2f7ff;max-width:750px;margin:auto;padding:20px}button{padding:14px;border:0;border-radius:9px;background:#327cb2;color:white;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172e42;padding:14px;border-radius:10px}p{line-height:1.5}</style><h2>Diagnostic ciblé du stockage — téléphone 1</h2><p>Lecture seule. Ce diagnostic n'affiche ni les noms des clés ni les données clients. Il regroupe les clés par taille et repère celles qui ressemblent à des données temporaires ou historiques. Aucun changement de stockage.</p><button id="go">Analyser les clés locales</button><pre id="result">En attente.</pre><script>
const mio=x=>Math.round(x/1048576*1000)/1000;
function group(k){let s=k.toLowerCase();if(/client/.test(s))return 'Clients';if(/intervention/.test(s))return 'Interventions';if(/backup|sauvegarde|archive|ancien|old/.test(s))return 'Sauvegardes / anciennes versions';if(/diagnostic|audit|test|temoin|verification|comparaison|reparation/.test(s))return 'Diagnostics et tests';if(/chaudi|pac|adouc|equip/.test(s))return 'Équipements';if(/stock/.test(s))return 'Stock';if(/sync|cloud|queue|baseline|empreinte/.test(s))return 'Synchronisation';if(/photo|image|document|pdf/.test(s))return 'Images et documents';return 'Autres (non classées)'}
function bucket(n){if(n<1024)return 'moins de 1 Kio';if(n<10240)return '1 à 10 Kio';if(n<102400)return '10 à 100 Kio';if(n<1048576)return '100 Kio à 1 Mio';return '1 Mio et plus'}
document.getElementById('go').onclick=()=>{let r=document.getElementById('result');try{let rows=[],byGroup={},byBucket={},count=localStorage.length;for(let i=0;i<count;i++){let k=localStorage.key(i),v=localStorage.getItem(k)||'',b=2*(k.length+v.length),g=group(k),z=bucket(b);rows.push({g,b,z});byGroup[g]??={count:0,bytes:0};byGroup[g].count++;byGroup[g].bytes+=b;byBucket[z]??={count:0,bytes:0};byBucket[z].count++;byBucket[z].bytes+=b;}let out={date:new Date().toISOString(),origine:location.origin,mode:'lecture seule',cles:rows.length,totalMio:mio(rows.reduce((a,x)=>a+x.b,0)),repartitionParCategorie:Object.fromEntries(Object.entries(byGroup).sort((a,b)=>b[1].bytes-a[1].bytes).map(([k,x])=>[k,{cles:x.count,volumeMio:mio(x.bytes)}])),repartitionParTaille:Object.fromEntries(Object.entries(byBucket).map(([k,x])=>[k,{cles:x.count,volumeMio:mio(x.bytes)}])),vingtPlusGrossesEntreesSansIdentifiants:rows.sort((a,b)=>b.b-a.b).slice(0,20).map((x,i)=>({rang:i+1,categorie:x.g,tailleKio:Math.round(x.b/1024)})),precisions:'Les catégories dépendent seulement des noms des clés et peuvent être imprécises. Aucun nom de clé ni contenu n’est affiché.'};r.textContent=JSON.stringify(out,null,2)}catch(e){r.textContent='Erreur de lecture : '+e.message}}</script></html>
