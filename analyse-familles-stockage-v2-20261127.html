<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Analyse des 378 clés — lecture seule</title><style>body{font:16px system-ui;background:#0b1b2a;color:#eef6ff;max-width:760px;margin:20px auto;padding:18px}button{background:#337eae;color:white;border:0;border-radius:9px;padding:13px;font-weight:700}pre{background:#173047;padding:15px;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}</style><h2>Analyse des clés non classées</h2><p>Lecture seule. Aucun contenu de fiche, aucun nom de clé et aucun identifiant client ne sera affiché. Les familles de clés sont anonymisées.</p><button id="run">Identifier les familles</button><pre id="out">En attente.</pre><script>
const round=n=>Math.round(n/1024);
const known=/client|intervention|backup|sauvegarde|archive|ancien|old|diagnostic|audit|test|temoin|verification|comparaison|reparation|chaudi|pac|adouc|equip|stock|sync|cloud|queue|baseline|empreinte|photo|image|document|pdf/i;
function stem(k){return k.replace(/[0-9a-f]{8}-[0-9a-f-]{20,}/gi,'#').replace(/\d{4,}/g,'#').replace(/[0-9a-f]{24,}/gi,'#').replace(/\d+$/,'#')}
function shape(v){let t=v.trim();if(t.startsWith('data:'))return 'donnée encodée';if(t.startsWith('{')||t.startsWith('[')){try{let x=JSON.parse(t);return Array.isArray(x)?'tableau JSON':x&&typeof x==='object'?'objet JSON':'JSON autre'}catch(e){return 'texte'}}return 'texte'}
document.getElementById('run').onclick=()=>{try{let families=new Map(),total=0,rows=0,shapes={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(known.test(k))continue;let v=localStorage.getItem(k)||'',bytes=2*(k.length+v.length),s=stem(k),z=shape(v);total+=bytes;rows++;shapes[z]=(shapes[z]||0)+1;let o=families.get(s)||{count:0,bytes:0,min:Infinity,max:0,types:{},exampleLengths:[]};o.count++;o.bytes+=bytes;o.min=Math.min(o.min,bytes);o.max=Math.max(o.max,bytes);o.types[z]=(o.types[z]||0)+1;families.set(s,o)}let sorted=[...families.values()].sort((a,b)=>b.bytes-a.bytes);let out={date:new Date().toISOString(),mode:'lecture seule',nombreClesNonClassees:rows,volumeKio:round(total),nombreFamillesDeCles:families.size,typesDeValeurs:shapes,principalesFamillesAnonymisees:sorted.slice(0,12).map((o,i)=>({famille:'Groupe '+(i+1),nombreDeCles:o.count,volumeKio:round(o.bytes),tailleMinKio:round(o.min),tailleMaxKio:round(o.max),types:o.types})),note:'Les familles sont regroupées par nom de clé normalisé, sans divulguer le nom ni le contenu. Un groupe de 1 clé peut correspondre à une clé unique.'};document.getElementById('out').textContent=JSON.stringify(out,null,2)}catch(e){document.getElementById('out').textContent='Erreur : '+e.message}}</script></html>
